<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" role="img" aria-labelledby="title desc">
<title id="title">THREADS illustrated outdoor travel backpack</title>
<desc id="desc">Illustrated turquoise and burnt orange technical travel backpack with straps, cap, sneaker and water bottle.</desc>
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45b3b1"/><stop offset=".43" stop-color="#248e9d"/><stop offset="1" stop-color="#125270"/></linearGradient>
  <linearGradient id="orange" x1=".1" y1=".1" x2=".92" y2="1"><stop stop-color="#ffc074"/><stop offset=".38" stop-color="#f27f37"/><stop offset="1" stop-color="#c84a25"/></linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#ef9941"/><stop offset="1" stop-color="#b74c25"/></linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#1a6e80"/><stop offset="1" stop-color="#143747"/></linearGradient>
  <linearGradient id="shoe" x1=".1" y1="0" x2=".95" y2="1"><stop stop-color="#f9e4bd"/><stop offset="1" stop-color="#e4d5bb"/></linearGradient>
  <pattern id="stitch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="m0 7 6 2" fill="none" stroke="#f3dcac" stroke-width="1.3" opacity=".48"/></pattern>
  <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<ellipse cx="306" cy="409" rx="236" ry="18" fill="#27473e" opacity=".19" filter="url(#shadow)"/>
