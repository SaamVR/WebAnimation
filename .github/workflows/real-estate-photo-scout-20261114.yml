name: Real Estate Editorial Photo Scout
on:
  push:
    branches: [media/fiverr-gig-video-source-20261113]
    paths: [.github/workflows/real-estate-photo-scout-20261114.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download known Pexels Free-license photos by canonical photo ID
        run: |
          mkdir -p photos
          cat > /tmp/photos.py <<'PY'
          import json,requests,os
          sources={
            'pool_hero':(40808027,'https://www.pexels.com/photo/luxurious-modern-house-with-pool-and-patio-40808027/','Alef Morais'),
            'glass_villa':(28586202,'https://www.pexels.com/photo/modern-luxury-home-with-glass-facade-and-pool-28586202/','Jonathan Borba'),
            'white_villa':(40807982,'https://www.pexels.com/photo/modern-luxury-home-with-pool-in-sunny-setting-40807982/','Alef Morais'),
            'sunlit_living':(34277650,'https://www.pexels.com/photo/luxurious-modern-living-room-with-natural-light-34277650/','Alef Morais'),
            'warm_interior':(37760315,'https://www.pexels.com/photo/modern-living-room-with-stylish-decor-and-natural-light-37760315/','Curtis Adams'),
            'high_ceiling':(40808026,'https://www.pexels.com/photo/modern-luxury-living-room-with-high-ceilings-40808026/','Alef Morais')
          }
          out={}
          for name,(id,link,by) in sources.items():
            row={'page':link,'photographer':by,'license':'https://www.pexels.com/license/'}
            url=f'https://images.pexels.com/photos/{id}/pexels-photo-{id}.jpeg?auto=compress&cs=tinysrgb&w=1800'
            try:
              r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=35)
              r.raise_for_status()
              if not r.headers.get('content-type','').startswith('image/'):raise Exception('unexpected content type')
              if len(r.content)<20000:raise Exception('tiny/invalid image')
              p='photos/'+name+'.jpg';open(p,'wb').write(r.content)
              row.update({'status':'downloaded','asset':p,'source_url':url,'bytes':len(r.content)})
            except Exception as e:row.update({'status':'unavailable','reason':str(e)[:260]})
            out[name]=row;print(name,row['status'],row.get('reason',''))
          open('photos/PROVENANCE.json','w').write(json.dumps(out,indent=2))
          if sum(v['status']=='downloaded' for v in out.values())<3:raise SystemExit('Not enough verified photos')
          PY
          python /tmp/photos.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-estate-pexels-photo-proof
          path: photos/
          retention-days: 7
          if-no-files-found: error