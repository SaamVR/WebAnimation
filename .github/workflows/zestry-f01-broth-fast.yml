name: ZESTRY F01 live broth probe fast (NO DEPLOY)
on:
  push:
    branches:
      - qa/zestry-f01-broth-mask-regression-20261118
    paths:
      - .github/workflows/zestry-f01-broth-fast.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser dependencies (do not run slow apt install)
        run: |
          pip install playwright==1.56.0 Pillow==11.3.0
          python -m playwright install chromium
      - name: Compare visible and hidden broth on real deployed site
        run: python projects/restaurant-demo/zestry-v3-editorial/qa_v17_broth_mask_probe.py
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZESTRY-BROTH-PROBE-FAST
          path: projects/restaurant-demo/docs/qa/owner-v17-broth-regression/
          retention-days: 15
      - name: Commit diagnostic proof only to QA branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/restaurant-demo/docs/qa/owner-v17-broth-regression
          if ! git diff --cached --quiet; then
            git commit -m 'test(zestry): live broth contribution evidence [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
