name: CHAPCHITRA approved button component naming migration
on:
  push:
    branches:
      - feature/chapchitra-c06-long-svg-20261111
permissions:
  contents: write
jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify refs and prepare independent historical worktrees
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune
          test "$(git rev-parse origin/feature/chapchitra-c05-compact-svg-20261109)" = 'c3dafdb6687e053dcf86e19a424b83c189504bea'
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/chapchitra-c06-long-svg-20261111)"
          test "$(git rev-parse origin/deploy/chapchitra-render-review)" = 'b99fe7b1648aa870c782a6ecda3deef0f5a838c5'
          git worktree add --detach /tmp/chapchitra-compact origin/feature/chapchitra-c05-compact-svg-20261109
          git worktree add --detach /tmp/chapchitra-before 32e6d50aff357a739023ba6de1f3f5f4ce1d583c
          git config user.name 'CHAPCHITRA UI naming migration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/chapchitra-compact config user.name 'CHAPCHITRA UI naming migration'
          git -C /tmp/chapchitra-compact config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Update names only; leave approved artwork unchanged
        run: |
          python projects/chapchitra/scripts/rename_ui_identifiers.py --root . --mode all
          git diff --check && git diff --cached --check
          git -C /tmp/chapchitra-compact diff --check
      - name: Build and test candidate, compact-only and frozen original
        shell: bash
        run: |
          set -euo pipefail
          for folder in /tmp/chapchitra-compact/projects/chapchitra "$GITHUB_WORKSPACE/projects/chapchitra" /tmp/chapchitra-before/projects/chapchitra; do
            (cd "$folder" && npm ci --no-audit --no-fund && npm run build)
          done
      - name: Chromium and WebKit QA of original interactions and unchanged pixels
        shell: bash
        run: |
          set -euo pipefail
          cd projects/chapchitra
          npx playwright install --with-deps chromium webkit
          (PORT=4173 npm run preview > /tmp/chapchitra-long-review.log 2>&1) &
          (cd /tmp/chapchitra-before/projects/chapchitra && PORT=4174 npm run preview > /tmp/chapchitra-compact-before.log 2>&1) &
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:4173/buttons/long/ > /dev/null && curl -fsS http://127.0.0.1:4174/buttons/compact/ > /dev/null; then break; fi
            sleep 1
          done
          LONG_URL=http://127.0.0.1:4173 LONG_BEFORE_URL=http://127.0.0.1:4174 node scripts/long-browser-qa.cjs
      - name: Push tested non-force Long feature commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'refactor(chapchitra): replace invented UI numbers across source, docs and tests'
          git push origin HEAD:refs/heads/feature/chapchitra-c06-long-svg-20261111
          echo "COMPACT_SHA=$(git -C /tmp/chapchitra-compact rev-parse HEAD)"
          echo "LONG_SHA=$(git rev-parse HEAD)"
      - name: Rename four Github refs in place, retaining PR review history
        shell: bash
        run: |
          set -euo pipefail
          rename_ref() {
            local old="$1" new="$2"
            local encoded=$(printf '%s' "$old" | sed 's#/#%2F#g')
            echo "Renaming $old to $new"
            gh api -X POST "repos/$GITHUB_REPOSITORY/branches/$encoded/rename" -f "new_name=$new" --silent
          }
          rename_ref review/chapchitra-c05-approval-base-20261109 review/chapchitra-compact-buttons-approval-base
          rename_ref review/chapchitra-c06-approval-base-20261111 review/chapchitra-long-buttons-approval-base
          rename_ref feature/chapchitra-c05-compact-svg-20261109 feature/chapchitra-compact-svg-buttons
          rename_ref feature/chapchitra-c06-long-svg-20261111 feature/chapchitra-long-svg-buttons
      - name: Update only shared Render review via fast-forward, never main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin deploy/chapchitra-render-review
          test "$(git rev-parse origin/deploy/chapchitra-render-review)" = 'b99fe7b1648aa870c782a6ecda3deef0f5a838c5'
          git push origin HEAD:refs/heads/deploy/chapchitra-render-review
          echo "REVIEW_SHA=$(git rev-parse HEAD)"
      - name: Archive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapchitra-compact-long-naming-regression
          path: projects/chapchitra/perf-results/long-final/
          if-no-files-found: warn
          retention-days: 30
