name: Campaign media QA
on:
  push:
    branches:
      - feat/motion-portfolio-media-first-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-route-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts compile
        run: |
          node --check site/campaign/campaign.js
          node --check site/assets/solecraft-actual-shoe-poster.js
      - name: Check nine campaign routes and media/source contracts
        run: node scripts/check-campaign-media.mjs
      - name: Verify functional Relay workflow core
        run: node --test scripts/tests/relay-workflow.test.mjs
      - name: Prepare Chromium browser testing
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium --with-deps
      - name: Audit real browser rendering and campaign interactions
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 --directory site > /tmp/campaign-server.log 2>&1 &
          sleep 2
          node scripts/campaign-browser-qa.mjs
      - name: Preserve visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-browser-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
