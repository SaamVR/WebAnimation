name: ZESTRY F01 V4 exact upload — FINAL LIVE native-browser QA (NO DEPLOY)
on:
  push:
    branches:
      - qa/zestry-f01-v4-circle-final-live-20261118
    paths:
      - projects/restaurant-demo/zestry-v3-editorial/qa_f01_v4_final_live.py
      - .github/workflows/zestry-f01-v4-final-live-qa.yml
permissions:
  contents: read
jobs:
  public-site-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout independent live QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native Chromium and image comparison
        run: |
          python -m pip install "playwright==1.56.0" "Pillow==11.3.0"
          python -m playwright install chromium
      - name: Verify exact JSON SHA, circle fit, broth and full playback at real deployed URL
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/qa_f01_v4_final_live.py
      - name: Upload browser videos and frame screenshots even on failed review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZESTRY-F01-V4-FINAL-LIVE-ORIGINAL-WEBM-QA
          path: projects/restaurant-demo/docs/qa/f01-v4-circle-final-live/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit passing public-site evidence to QA branch ONLY
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/restaurant-demo/docs/qa/f01-v4-circle-final-live/
          git diff --cached --name-only >/tmp/f01-qa-scope.txt
          if grep -v '^projects/restaurant-demo/docs/qa/f01-v4-circle-final-live/' /tmp/f01-qa-scope.txt; then
            echo 'Out of scope file write'; exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'test(zestry): final public V4 circle and natural playback evidence [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo 'No deployment, no mutation of release branch'
