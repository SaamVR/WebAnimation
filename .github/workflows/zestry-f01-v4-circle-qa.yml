name: ZESTRY F01 V4 exact Lottie circular fit - native Chromium QA (NO DEPLOY)
on:
  push:
    branches:
      - feat/zestry-f01-v4-immutable-circle-20261118
    paths:
      - projects/restaurant-demo/zestry-v3-editorial/integrate_f01_v4_immutable_circle.py
      - projects/restaurant-demo/zestry-v3-editorial/qa_f01_v4_circle.py
      - .github/workflows/zestry-f01-v4-circle-qa.yml
permissions:
  contents: read
jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure approved F01 source exactly matches owner's file
        run: |
          sha256sum projects/restaurant-demo/assets/lottie/f01.json
          echo '7fc0054b5ae4c1c7a13d0a3c5e321d117d570d8f0d71e3308ee076a48d301e37  projects/restaurant-demo/assets/lottie/f01.json' | sha256sum -c
      - name: Integrate only unmodified original master and host-level circular mask
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/integrate_f01_v4_immutable_circle.py
      - name: Install real Chromium and image analysis
        run: |
          pip install "playwright==1.56.0" "Pillow==11.3.0"
          python -m playwright install chromium
      - name: Test F01 native SVG, all major frames, full-size circle and original broth
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/qa_f01_v4_circle.py
      - name: Preserve QA screenshots even if a quality gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZESTRY-F01-V4-UNMODIFIED-CIRCLE-QA
          path: projects/restaurant-demo/docs/qa/f01-v4-circle-candidate/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish fully verified ZIP and screenshots only to feature branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/restaurant-demo/review_bundle/ \
            projects/restaurant-demo/docs/qa/f01-v4-circle-candidate/
          git diff --cached --name-only >/tmp/f01-files.txt
          if grep -v '^projects/restaurant-demo/' /tmp/f01-files.txt; then
            echo 'Outside project scope';exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'test(zestry): exact V4 Lottie, circular mask screenshots and native browser proof [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo 'NO MERGE OR RENDER DEPLOYMENT; awaiting quality review'
