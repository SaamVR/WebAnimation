name: ZESTRY original F01 V4 native renderer diagnostic (NO DEPLOY)
on:
  push:
    branches:
      - feat/zestry-f01-v4-immutable-circle-20261118
    paths:
      - projects/restaurant-demo/zestry-v3-editorial/qa_f01_v4_native_probe.py
      - .github/workflows/zestry-f01-v4-native-probe.yml
permissions:
  contents: read
jobs:
  render-original-master:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium renderer and pixel comparison
        run: |
          pip install "playwright==1.56.0" "Pillow==11.3.0"
          python -m playwright install chromium
      - name: Probe unmodified native Lottie master and broth rendering
        run: python projects/restaurant-demo/zestry-v3-editorial/qa_f01_v4_native_probe.py
      - name: Save proof of actual native SVG frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZESTRY-F01-V4-NATIVE-LottieWeb-PROBE
          path: projects/restaurant-demo/docs/qa/f01-v4-native-probe/
          if-no-files-found: warn
      - name: Commit native renderer evidence to isolated feature branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/restaurant-demo/docs/qa/f01-v4-native-probe
          if ! git diff --cached --quiet; then
            git commit -m 'test(zestry): unchanged V4 native renderer screenshots [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo 'No Render deployment'
