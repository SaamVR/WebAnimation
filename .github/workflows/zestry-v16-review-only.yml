name: ZESTRY V16 enlarged-hero review (NO DEPLOY)
# This workflow ONLY prepares a local review ZIP and browser QA on a feature branch.
# It never triggers Render, Vercel, a deployment environment, or a production release.
on:
  push:
    branches:
      - feat/zestry-v16-30pct-over-v15-review-20261118
    paths:
      - projects/restaurant-demo/zestry-v3-editorial/package_v16_relative30.py
      - projects/restaurant-demo/zestry-v3-editorial/qa_v16_relative30.py
      - .github/workflows/zestry-v16-review-only.yml

permissions:
  contents: read

jobs:
  visual-review-only:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout isolated review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install Chromium and QA dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright, Pillow, NumPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "Pillow>=11.0,<13" "numpy>=1.26,<3"
          python -m playwright install --with-deps chromium

      - name: Generate the V16 review ZIP without touching the live deploy branch
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/package_v16_relative30.py \
            --baseline-site /tmp/zestry-v15-original \
            --review-site /tmp/zestry-v16-review
          test -f /tmp/zestry-v16-review/assets/lottie/f01-v16.json
          test -f /tmp/zestry-v15-original/assets/lottie/f01.json
          echo "The original approved F01 remains stored separately and unchanged."

      - name: Full native-Chromium clip, size, and natural playback tests
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/qa_v16_relative30.py \
            --baseline-site /tmp/zestry-v15-original \
            --review-site /tmp/zestry-v16-review \
            --output projects/restaurant-demo/docs/qa/owner-v16-relative30

      - name: Upload review-only browser screenshots, comparison and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZESTRY-V16-30-percent-bigger-review-only
          path: |
            projects/restaurant-demo/docs/qa/owner-v16-relative30/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit reviewed package and evidence to the SAME nondeployment feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/restaurant-demo/review_bundle projects/restaurant-demo/docs/qa/owner-v16-relative30
          git diff --cached --name-only | tee /tmp/zestry-v16-changed-files.txt
          if grep -v '^projects/restaurant-demo/' /tmp/zestry-v16-changed-files.txt; then
            echo "Out-of-scope file changed; refusing review commit"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Review package unchanged"
          else
            git commit -m "build(zestry): V16 30%-bigger review bundle and Chromium QA [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "This workflow NEVER merges or deploys."
