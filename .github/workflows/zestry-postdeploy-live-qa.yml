name: ZESTRY live Render verification (no redeploy)
on:
  push:
    branches:
      - qa/zestry-postdeploy-live-20261119
permissions:
  contents: read
jobs:
  real-hosted-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact deployed SHA is the QA branch base
        run: |
          git merge-base --is-ancestor a81332d7faf5c277e03207e5e2513d174d124919 HEAD
          git diff --name-only a81332d7faf5c277e03207e5e2513d174d124919 HEAD > /tmp/qa-changed.txt
          grep -v -E '^projects/restaurant-demo/zestry-v3-editorial/qa_live_render_20261119.py$|^\.github/workflows/zestry-postdeploy-live-qa.yml$' /tmp/qa-changed.txt >/tmp/other-changes.txt || true
          if test -s /tmp/other-changes.txt; then cat /tmp/other-changes.txt; exit 1; fi
          echo "QA branch does not alter deployed site."
      - name: Prepare installed Chrome plus Playwright recording dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install ffmpeg
          google-chrome --version
      - name: Verify real hosted HTML, Lottie SHA256, form layout and viewport playback
        run: python projects/restaurant-demo/zestry-v3-editorial/qa_live_render_20261119.py
      - name: Upload screenshots, videos, and live-URL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zestry-render-live-pr141-qa
          path: projects/restaurant-demo/docs/qa/live-verification-20261119/
          if-no-files-found: warn
          retention-days: 30
