name: ZESTRY V16 static F01 QA ONLY - NO DEPLOY
on:
  push:
    branches:
      - feat/zestry-v16-30pct-over-v15-review-20261118
    paths:
      - projects/restaurant-demo/zestry-v3-editorial/package_v16_relative30.py
      - projects/restaurant-demo/zestry-v3-editorial/qa_v16_relative30.py
      - .github/workflows/zestry-v16-static-qa-only.yml

permissions:
  contents: read

jobs:
  constant-size-visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    permissions:
      contents: write
    steps:
      - name: Checkout V16 isolated review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright Chromium and image-analysis dependencies
        run: |
          python -m pip install "playwright==1.56.0" "Pillow>=11.0,<13" "numpy>=1.26,<3"
          python -m playwright install --with-deps chromium
      - name: Build V16 1.755x constant-size review bundle
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/package_v16_relative30.py \
            --baseline-site /tmp/zestry-v16-dynamic-original \
            --review-site /tmp/zestry-v16-fixed
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          site=Path('/tmp/zestry-v16-fixed')
          html=(site/'index.html').read_text()
          assert 'const zoom=1.755;' in html
          assert 'const zoom=1+0.755*ease;' not in html
          assert 'mountF01V16FixedSize' in html
          q=json.loads((site/'assets/lottie/f01-v16.json').read_text())
          assert q['fr']==30 and q['op']==261
          assert hashlib.sha256((site/'assets/lottie/f01.json').read_bytes()).hexdigest()=='7fc0054b5ae4c1c7a13d0a3c5e321d117d570d8f0d71e3308ee076a48d301e37'
          print('Fixed-camera 1.755x verified; canonical F01 unchanged')
          PY
      - name: Check 261 frames desktop tablet mobile and natural browser playback
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/qa_v16_relative30.py \
            --baseline-site /tmp/zestry-v16-dynamic-original \
            --review-site /tmp/zestry-v16-fixed \
            --output projects/restaurant-demo/docs/qa/owner-v16-fixed
      - name: Preserve evidence even if candidate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZESTRY-V16-static-size-frame-by-frame-evidence
          path: projects/restaurant-demo/docs/qa/owner-v16-fixed/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit approved QA assets to review branch only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/restaurant-demo/review_bundle projects/restaurant-demo/docs/qa/owner-v16-fixed
          git diff --cached --name-only > /tmp/zestry-file-scope.txt
          if grep -v '^projects/restaurant-demo/' /tmp/zestry-file-scope.txt; then
            echo 'Out of scope file; refusing commit'
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'test(zestry): fixed 1.755x F01 Chromium review [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo 'NO deployment, NO merge, review branch only.'
