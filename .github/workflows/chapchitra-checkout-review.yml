name: CHAPCHITRA checkout review
on:
  push:
    branches:
      - review/chapchitra-unified-purchase-20261128
    paths:
      - 'projects/chapchitra/**'
      - '.github/workflows/chapchitra-checkout-review.yml'
  pull_request:
    branches:
      - review/chapchitra-unified-about-20261128
    paths:
      - 'projects/chapchitra/**'
      - '.github/workflows/chapchitra-checkout-review.yml'
permissions:
  contents: read
concurrency:
  group: chapchitra-checkout-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checkout-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/chapchitra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/checkout-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapchitra-checkout-browser-review
          path: projects/chapchitra/checkout-review-artifacts/
          retention-days: 7
