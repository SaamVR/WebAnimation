name: ZESTRY restored V17 LIVE acceptance (NO DEPLOY)
on:
  push:
    branches:
      - qa/zestry-rollback-v17-proof-20261118
    paths:
      - projects/restaurant-demo/zestry-v3-editorial/qa_v18_rollback_live.py
      - .github/workflows/zestry-v17-rollback-proof.yml

permissions:
  contents: read

jobs:
  verify-restored-website:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native Chromium browser and image comparison
        run: |
          python -m pip install 'playwright==1.56.0' 'Pillow==11.3.0'
          python -m playwright install chromium
      - name: Verify actual Render live URL after V18 revert
        run: python projects/restaurant-demo/zestry-v3-editorial/qa_v18_rollback_live.py
      - name: Archive browser recordings and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZESTRY-V17-RESTORED-LIVE-CHROMIUM-PROOF
          path: projects/restaurant-demo/docs/qa/v18-rollback-live-proof/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish successful proof on independent QA branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/restaurant-demo/docs/qa/v18-rollback-live-proof/
          if ! git diff --cached --quiet; then
            git commit -m 'test(zestry): live V17 rollback F01 F02 verified [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo 'No deployment and no integration branch mutations'
