name: ZESTRY owner-marked wide reservation art QA (temporary)
on:
  push:
    branches:
      - feat/zestry-visible-forward-loops-20261119
permissions:
  contents: write
concurrency:
  group: zestry-wide-reservation-pr141
  cancel-in-progress: false
jobs:
  wide-banner-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no non-ZESTRY files are modified
        run: |
          git fetch --no-tags --depth=1 origin deploy/zestry-v3-render-review-20261116
          git diff --name-only FETCH_HEAD HEAD >/tmp/changed-files.txt
          grep -v -E '^projects/restaurant-demo/|^\.github/workflows/zestry-wide-reservation-temporary.yml$' /tmp/changed-files.txt >/tmp/unrelated-files.txt || true
          if test -s /tmp/unrelated-files.txt; then cat /tmp/unrelated-files.txt; exit 1; fi
          echo "Only ZESTRY project + temporary QA workflow."
      - name: Install browser acceptance tooling (preinstalled Chrome)
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install ffmpeg
          google-chrome --version
      - name: Apply owner-marked wide rectangle to existing review ZIP, preserving masters
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/refine_reservation_modal.py --check
          python projects/restaurant-demo/zestry-v3-editorial/refine_reservation_modal.py
          python projects/restaurant-demo/zestry-v3-editorial/refine_reservation_modal.py --check
      - name: Chrome desktop iPad mobile narrow layout, Lottie and reservation flow QA
        run: python projects/restaurant-demo/zestry-v3-editorial/qa_reservation_modal.py
      - name: Entire F01-F07 playback, F05 menu, F04 checkout regression
        run: python projects/restaurant-demo/zestry-v3-editorial/qa_visible_loops.py
      - name: Save real desktop/mobile screenshots and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zestry-pr141-wide-reservation-panel-qa
          path: |
            projects/restaurant-demo/docs/qa/owner-reservation-modal-20261119/
            projects/restaurant-demo/docs/qa/owner-visible-loops-20261119/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit verified website archive and QA only to current feature branch
        if: success()
        run: |
          git config user.name "ZESTRY QA GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add projects/restaurant-demo/review_bundle/ \
            projects/restaurant-demo/docs/qa/owner-reservation-modal-20261119/PR141_RESERVATION_MODAL_QA.json \
            projects/restaurant-demo/docs/qa/owner-visible-loops-20261119/PR141_VISIBLE_LOOP_QA.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat(zestry): integrate owner-marked wide reservation animation and browser QA"
            git push origin HEAD:feat/zestry-visible-forward-loops-20261119
          fi
