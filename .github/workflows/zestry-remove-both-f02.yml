name: ZESTRY remove both F02 chefs — source QA only (NO DEPLOY)
on:
  push:
    branches:
      - remove/zestry-both-f02-chefs-await-owner-lottie-20261119
    paths:
      - projects/restaurant-demo/zestry-v3-editorial/remove_both_f02_visuals_pending_upload.py
      - projects/restaurant-demo/zestry-v3-editorial/qa_both_f02_removed.py
      - .github/workflows/zestry-remove-both-f02.yml
permissions:
  contents: read
jobs:
  remove-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove only both F02 displays/loader from current source ZIP
        run: python projects/restaurant-demo/zestry-v3-editorial/remove_both_f02_visuals_pending_upload.py
      - name: Install Chromium for local-only browser regression checks
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install chromium
      - name: Verify no F02 is displayed or requested and all other scenes work
        run: python projects/restaurant-demo/zestry-v3-editorial/qa_both_f02_removed.py
      - name: Preserve QA report and screenshots on errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZESTRY-F02-REMOVAL-LOCAL-QA-NO-DEPLOY
          path: projects/restaurant-demo/docs/qa/f02-removal-before-new-upload/
          if-no-files-found: warn
          retention-days: 15
      - name: Commit validated ZIP to source branch ONLY, without deployment
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/restaurant-demo/review_bundle/ \
            projects/restaurant-demo/docs/qa/f02-removal-before-new-upload/
          if git diff --cached --name-only | grep -v '^projects/restaurant-demo/'; then
            echo 'Out-of-scope change'; exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'test(zestry): both chef views removed; original assets preserved [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo 'NO Render deployment, no preview site and no changes to unrelated projects.'
