name: ZESTRY V16 approved-motion rollback + broth-only mask QA (NO DEPLOY)
on:
  push:
    branches:
      - rollback/zestry-v16-owner-approved-motion-20261118
    paths:
      - projects/restaurant-demo/zestry-v3-editorial/patch_v16_broth_mask_only.py
      - projects/restaurant-demo/zestry-v3-editorial/qa_v16_restore_motion.py
      - .github/workflows/zestry-v16-motion-rollback-gate.yml
permissions:
  contents: read
jobs:
  verify-exact-V16-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout rollback feature, NOT deployment
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply ONLY brood-mask SVG ID namespace to V16 ZIP
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/patch_v16_broth_mask_only.py
      - name: Install browser runtime for V16 natural motion review
        run: |
          python -m pip install 'playwright==1.56.0' 'Pillow==11.3.0'
          python -m playwright install chromium
      - name: Compare real F01/chef and original V16 playback in Chrome
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/qa_v16_restore_motion.py
      - name: Archive desktop/mobile recorded evidence even if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZESTRY-V16-MOTION-RESTORE-REVIEW
          path: projects/restaurant-demo/docs/qa/owner-v16-motion-rollback/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish candidate rollback ZIP ONLY after complete QA
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/restaurant-demo/review_bundle/ projects/restaurant-demo/docs/qa/owner-v16-motion-rollback/
          if git diff --cached --name-only | grep -v '^projects/restaurant-demo/'; then
            echo 'Scope violation'; exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'test(zestry): verify exact approved V16 motion and isolated broth mask [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo 'NO MERGE OR DEPLOY; candidate only'
