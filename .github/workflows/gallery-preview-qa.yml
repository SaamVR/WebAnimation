name: Gallery preview QA
on:
  push:
    branches:
      - feat/gallery-preview-budget-20261013
  pull_request:
    paths:
      - 'site/index.html'
      - 'site/assets/gallery-previews.mjs'
      - 'scripts/tests/gallery-previews.test.mjs'
      - 'scripts/gallery-browser-qa.mjs'
      - '.github/workflows/gallery-preview-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery-contracts-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and deterministic selection contracts
        run: |
          node --check site/assets/gallery-previews.mjs
          node --check scripts/gallery-browser-qa.mjs
          node --test scripts/tests/gallery-previews.test.mjs
          node scripts/check-campaign-media.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium --with-deps
      - name: Check live gallery code via local static server
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 --directory site > /tmp/gallery-qa-server.log 2>&1 &
          sleep 2
          node scripts/gallery-browser-qa.mjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-preview-browser-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
