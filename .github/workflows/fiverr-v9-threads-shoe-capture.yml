name: Fiverr V9 Threads Real Shoe To Cart
on:
  push:
    branches: [production/fiverr-six-projects-v8-20261118]
    paths:
      - .github/workflows/fiverr-v9-threads-shoe-capture.yml
      - production/fiverr-master-v9/scripts/capture_threads_shoe.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SaamVR/WebAnimation
          ref: release/threads-demo-complete-20261026
          path: sources/threads
          sparse-checkout: site/threads
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install browser instrumentation
        run: |
          python -m pip install playwright==1.56.0
          command -v google-chrome || command -v google-chrome-stable
      - name: Record original approved T02 shoe flight
        run: python production/fiverr-master-v9/scripts/capture_threads_shoe.py
      - name: Preserve all original frames and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiverr-v9-threads-real-shoe-to-cart-frames
          path: out/shoe-to-cart/
          retention-days: 14
          compression-level: 5
          if-no-files-found: warn
