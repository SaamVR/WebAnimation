name: ZESTRY F02 exact owner-upload single chef QA (NO DEPLOY)
on:
  push:
    branches:
      - feat/zestry-single-f02-full360-owner20261119
    paths:
      - projects/restaurant-demo/zestry-v3-editorial/rebuild_owner_f02_360_exact.py
      - projects/restaurant-demo/zestry-v3-editorial/integrate_owner_f02_single_chef.py
      - projects/restaurant-demo/zestry-v3-editorial/qa_owner_f02_single_chef.py
      - .github/workflows/zestry-f02-single-final-qa.yml
permissions:
  contents: read
jobs:
  build-and-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout isolated source branch (never Render deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce EXACT 7s 30fps owner JSON and require uploaded SHA
        run: python projects/restaurant-demo/zestry-v3-editorial/rebuild_owner_f02_360_exact.py
      - name: Integrate single chef and rewrite only its surrounding section copy
        run: python projects/restaurant-demo/zestry-v3-editorial/integrate_owner_f02_single_chef.py
      - name: Install native Chromium
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install chromium
      - name: Test official Lottie runtime, all orbit positions, entire natural playback, F01/F05
        run: python projects/restaurant-demo/zestry-v3-editorial/qa_owner_f02_single_chef.py
      - name: Store browser evidence even if quality gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZESTRY-F02-OWNER-FULL360-SINGLE-CHEF-NATIVE-BROWSER
          path: projects/restaurant-demo/docs/qa/owner-f02-single-360-source-only/
          if-no-files-found: warn
          retention-days: 30
      - name: Save original owner Lottie checksum-verified source and validated site ZIP
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/restaurant-demo/assets/lottie/f02-chef-full360.json \
            projects/restaurant-demo/review_bundle/ \
            projects/restaurant-demo/docs/qa/owner-f02-single-360-source-only/
          if git diff --cached --name-only | grep -v '^projects/restaurant-demo/'; then
            echo "Out-of-scope changes forbidden"; exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'build(zestry): exact owner F02 single chef and native Chromium evidence [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo 'No Render deployment or preview created'
