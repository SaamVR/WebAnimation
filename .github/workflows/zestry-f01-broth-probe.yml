name: ZESTRY F01 broth regression diagnostics (NO DEPLOY)
on:
  push:
    branches:
      - qa/zestry-f01-broth-mask-regression-20261118
    paths:
      - projects/restaurant-demo/zestry-v3-editorial/qa_v17_broth_mask_probe.py
      - .github/workflows/zestry-f01-broth-probe.yml
permissions:
  contents: read
jobs:
  inspect-live-broth:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout QA-only branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Install Python and Chromium
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare Playwright
        run: |
          python -m pip install "playwright==1.56.0" "Pillow>=11,<13"
          python -m playwright install --with-deps chromium
      - name: Measure rendered broth visibility at 11 frames
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/qa_v17_broth_mask_probe.py
      - name: Upload mask and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZESTRY-LIVE-F01-BROTH-MASK-DIAGNOSTICS
          path: projects/restaurant-demo/docs/qa/owner-v17-broth-regression/
          if-no-files-found: warn
          retention-days: 15
      - name: Publish diagnostic report to QA branch only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/restaurant-demo/docs/qa/owner-v17-broth-regression/
          if ! git diff --cached --quiet; then
            git commit -m 'test(zestry): evidence from live broth mask trace [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo 'NO Render deployment or integration merge'
