name: ZESTRY V16 FINAL restored-motion live Chromium QA (NO DEPLOY)
on:
  push:
    branches:
      - qa/zestry-v16-restored-original-motion-live-20261118
    paths:
      - projects/restaurant-demo/zestry-v3-editorial/qa_v16_rollback_final_live.py
      - .github/workflows/zestry-v16-restored-final-live.yml
permissions:
  contents: read

jobs:
  live-restore-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: write
    steps:
      - name: Checkout separate evidence-only branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real Chromium and visual-contrast test
        run: |
          python -m pip install 'playwright==1.56.0' 'Pillow==11.3.0'
          python -m playwright install chromium
      - name: Verify actual restored public site — V16 F01 and F02, not V17
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/qa_v16_rollback_final_live.py
      - name: Upload desktop/mobile real recording evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZESTRY-V16-ORIGINAL-MOTION-LIVE-RECORDINGS
          path: projects/restaurant-demo/docs/qa/owner-v16-motion-restored-live/
          if-no-files-found: warn
          retention-days: 30
      - name: Archive passed live evidence to QA branch only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/restaurant-demo/docs/qa/owner-v16-motion-restored-live/
          git diff --cached --name-only >/tmp/zestry-scope.txt
          if grep -v '^projects/restaurant-demo/docs/qa/owner-v16-motion-restored-live/' /tmp/zestry-scope.txt; then
            echo "Out-of-scope write";exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'test(zestry): confirm original V16 and broth-only clip on live Render [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo 'No deployment, no other branch changes'
