name: ZESTRY PR141 temporary archive and browser QA
on:
  push:
    branches:
      - feat/zestry-visible-forward-loops-20261119

permissions:
  contents: write

concurrency:
  group: zestry-pr141-archive-qa-fast
  cancel-in-progress: true

jobs:
  approved-visible-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify feature-only files and untouched THREADS
        run: |
          git fetch --no-tags --depth=1 origin deploy/zestry-v3-render-review-20261116
          git diff --name-only FETCH_HEAD HEAD > /tmp/changed-paths.txt
          grep -v -E '^projects/restaurant-demo/|^\.github/workflows/zestry-pr141-temporary-qa.yml$' /tmp/changed-paths.txt > /tmp/nonzestry-changes.txt || true
          if test -s /tmp/nonzestry-changes.txt; then cat /tmp/nonzestry-changes.txt; exit 2; fi
          echo 'No changes to THREADS, CHAPCHITRA, or other projects.'
      - name: Install Python Lottie QA client using preinstalled Chrome
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Verify integration code and archive source hashes
        run: |
          python -m unittest discover -v -s projects/restaurant-demo/zestry-v3-editorial -p test_visible_loops.py
          python projects/restaurant-demo/zestry-v3-editorial/enable_visible_loops.py --check
      - name: Integrate loop wiring into ZESTRY archive only
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/enable_visible_loops.py
          python projects/restaurant-demo/zestry-v3-editorial/enable_visible_loops.py --check
      - name: Test shipped bundle with native Chromium (localhost only)
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/qa_visible_loops.py
      - name: Upload full QA evidence, video and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zestry-pr141-viewport-loop-qa
          path: projects/restaurant-demo/docs/qa/owner-visible-loops-20261119/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit only verified archive and QA JSON to feature branch
        if: success()
        run: |
          git config user.name "ZESTRY QA GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add projects/restaurant-demo/review_bundle/ projects/restaurant-demo/docs/qa/owner-visible-loops-20261119/PR141_VISIBLE_LOOP_QA.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat(zestry): integrate QA-verified visible-only replay into review archive"
            git push origin HEAD:feat/zestry-visible-forward-loops-20261119
          fi
