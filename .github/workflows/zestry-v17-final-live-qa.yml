name: ZESTRY V17.1 final deployed-browser QA (NO DEPLOY)
on:
  push:
    branches:
      - qa/zestry-v17-final-live-browser-20261118
    paths:
      - projects/restaurant-demo/zestry-v3-editorial/qa_v17_final_public_url.py
      - .github/workflows/zestry-v17-final-live-qa.yml

permissions:
  contents: read

jobs:
  check-actual-public-website:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout isolated evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Test actual ZESTRY Render public URL with desktop and mobile recordings
        env:
          ZESTRY_QA_DIR: projects/restaurant-demo/docs/qa/owner-v17-final-live
        run: |
          python projects/restaurant-demo/zestry-v3-editorial/qa_v17_final_public_url.py
      - name: Upload exact Chromium evidence including incomplete failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZESTRY-V17-1-FINAL-LIVE-CHROMIUM-QA
          path: projects/restaurant-demo/docs/qa/owner-v17-final-live/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish passing live evidence to QA branch only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/restaurant-demo/docs/qa/owner-v17-final-live/
          git diff --cached --name-only > /tmp/zestry-qa-only-scope.txt
          if grep -v '^projects/restaurant-demo/docs/qa/owner-v17-final-live/' /tmp/zestry-qa-only-scope.txt; then
            echo 'Unexpected file write'
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'test(zestry): final verified actual public URL desktop/mobile QA [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo 'No deployment, no merge. Only the isolated QA evidence branch was updated.'
