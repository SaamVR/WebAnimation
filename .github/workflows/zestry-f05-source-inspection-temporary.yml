name: ZESTRY focused source extraction (temporary; no deploy)
on:
  push:
    branches:
      - feat/zestry-f05-flips-food-alignment-compact-story-coffee-20261119
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact served F05 and site markup without modifying release files
        run: |
          mkdir -p /tmp/zestry-f05-inspect/assets
          cat projects/restaurant-demo/review_bundle/part-*.bin > /tmp/current-review.zip
          unzip -tq /tmp/current-review.zip
          unzip -p /tmp/current-review.zip index.html > /tmp/zestry-f05-inspect/index.html
          unzip -p /tmp/current-review.zip assets/f05_book.html > /tmp/zestry-f05-inspect/f05_book.html
          python - <<'PY'
          import zipfile,json
          z=zipfile.ZipFile('/tmp/current-review.zip')
          print('ARCHIVE',len(z.namelist()))
          print('F05_ZIP_ENTRIES',[n for n in z.namelist() if 'f05' in n.lower()])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zestry-f05-exact-served-html-and-site
          path: /tmp/zestry-f05-inspect/
          retention-days: 3
