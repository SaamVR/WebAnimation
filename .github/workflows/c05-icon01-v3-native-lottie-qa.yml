name: C05 Icon 01 V3 native Lottie browser QA

on:
  push:
    branches:
      - feature/chapchitra-c05-icon01-storybook-lottie-20261112
    paths:
      - animation-prototypes/chapchitra/c05/icon01/V3/**
      - .github/workflows/c05-icon01-v3-native-lottie-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vector-lottie-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated prototype
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned browser QA runtime (isolated only)
        working-directory: animation-prototypes/chapchitra/c05/icon01/V3
        run: |
          npm init -y
          npm install --no-save playwright@1.56.1
      - name: Install Chromium + WebKit and Linux browser dependencies
        working-directory: animation-prototypes/chapchitra/c05/icon01/V3
        run: npx playwright install --with-deps chromium webkit
      - name: Serve isolated V3 asset directory
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/c05-v3-http.log 2>&1 &
          sleep 2
      - name: Verify genuine Lottie playback, responsive layouts, and reduced motion
        run: node animation-prototypes/chapchitra/c05/icon01/V3/browser_qa.mjs
      - name: Upload non-sensitive visual QA frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c05-icon01-v3-browser-evidence
          path: c05-v3-browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
