<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font-family:system-ui;background:white;margin:0}
.stage{display:flex;gap:32px;align-items:flex-start;padding:16px}
.art{background:white;width:512px;height:512px;position:relative;flex-shrink:0}
.art>img,.art>svg{width:100%;height:100%}
#native svg{width:100%;height:100%}
</style><script src="/node_modules/lottie-web/build/player/lottie.min.js"></script></head>
<body><div class="stage"><div class="art" id="native"></div><div class="art" id="static"><img src="./More_than_a_tshirt_Icon_2_ORIGINAL.svg"></div></div>
<div id="ready" data-ok="waiting"></div>
<script>
window.nativeInstance=null;
fetch('./CHAPCHITRA_C05_Icon02_Rooted_in_Bengal_V1.json')
.then(r=>r.json()).then(data=>{
  if (!window.lottie) throw new Error('Official Lottie renderer missing');
  const inst=window.lottie.loadAnimation({container:document.querySelector('#native'),renderer:'svg',loop:false,autoplay:false,animationData:data});
  window.nativeInstance=inst;
  inst.addEventListener('DOMLoaded',()=>{document.querySelector('#ready').dataset.ok='yes'});
  inst.addEventListener('data_failed',()=>{document.querySelector('#ready').dataset.ok='failed'});
}).catch(e=>{document.querySelector('#ready').dataset.ok='failed';document.querySelector('#ready').textContent=String(e);});
</script></body></html>
